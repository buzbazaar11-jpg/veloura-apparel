<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veloura Apparel — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --line: #E2E8F0;
      --ink: #0F172A;
      --mut: #64748B;
      --soft: #F1F5F9;
      --em: #10B981;
      --em2: #059669;
      --co: #3B82F6;
      --in: #6366F1;
      --am: #F59E0B;
      --pk: #EC4899;
      --cr: #EF4444;
      --vi: #8B5CF6;
      --r: 18px;
      --sh: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px -12px rgba(15, 23, 42, .10)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: Manrope, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      -webkit-font-smoothing: antialiased
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font: inherit;
      font-weight: 700;
      background: var(--ink);
      color: #fff;
      border: 0;
      padding: 9px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: .2s transform, .2s box-shadow, .2s background
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -6px rgba(15, 23, 42, .35)
    }

    button.ghost {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line)
    }

    button.ghost:hover {
      background: var(--soft)
    }

    button.danger {
      background: var(--cr)
    }

    button.sm {
      padding: 6px 11px;
      font-size: 12px;
      border-radius: 10px
    }

    input,
    select,
    textarea {
      width: 100%;
      font: inherit;
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      transition: .15s border, .15s box-shadow
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--co);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, .12)
    }

    textarea {
      min-height: 80px;
      font-size: 13px
    }

    .app {
      display: grid;
      grid-template-columns: 248px 1fr;
      min-height: 100vh;
      transition: grid-template-columns .25s
    }

    .app.col {
      grid-template-columns: 76px 1fr
    }

    aside {
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 18px 12px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px 18px
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--in), var(--pk));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      flex-shrink: 0
    }

    .brand b {
      font-size: 15px;
      letter-spacing: .02em
    }

    .brand small {
      display: block;
      color: var(--mut);
      font-size: 11px;
      font-weight: 600
    }

    .grp {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #94A3B8;
      padding: 14px 12px 6px;
      text-transform: uppercase
    }

    aside a {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 12px;
      border-radius: 12px;
      color: #334155;
      font-weight: 600;
      font-size: 13.5px;
      white-space: nowrap
    }

    aside a .ic {
      width: 20px;
      text-align: center;
      flex-shrink: 0
    }

    aside a:hover {
      background: var(--soft)
    }

    aside a.on {
      background: linear-gradient(135deg, rgba(99, 102, 241, .12), rgba(236, 72, 153, .08));
      color: var(--in)
    }

    .app.col .brand div,
    .app.col aside a span,
    .app.col .grp {
      display: none
    }

    main {
      min-width: 0
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: rgba(248, 250, 252, .82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line)
    }

    .top h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.01em;
      flex: 1;
      text-transform: capitalize
    }

    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--em2);
      background: #ECFDF5;
      padding: 6px 10px;
      border-radius: 999px
    }

    .pulse:before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--em);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, .6);
      animation: p 1.8s infinite
    }

    @keyframes p {
      70% {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0)
      }
    }

    .body {
      padding: 24px 28px 100px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--sh)
    }

    .card h3 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 800
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 16px
    }

    .kpi {
      position: relative;
      overflow: hidden
    }

    .kpi:after {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--g);
      opacity: .14
    }

    .kpi .l {
      color: var(--mut);
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .kpi .dot {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--g);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 14px
    }

    .kpi b {
      display: block;
      font-size: 26px;
      font-weight: 800;
      margin: 12px 0 4px;
      letter-spacing: -.02em
    }

    .kpi small {
      font-weight: 700;
      font-size: 12px;
      color: var(--mut)
    }

    .up {
      color: var(--em2) !important
    }

    .dn {
      color: var(--cr) !important
    }

    .g2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 16px
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      text-transform: capitalize;
      background: var(--cb);
      color: var(--cf)
    }

    .s-pending {
      --cb: #FEF3C7;
      --cf: #B45309
    }

    .s-confirmed {
      --cb: #DBEAFE;
      --cf: #1D4ED8
    }

    .s-processing {
      --cb: #EDE9FE;
      --cf: #6D28D9
    }

    .s-shipped {
      --cb: #E0E7FF;
      --cf: #4338CA
    }

    .s-delivered {
      --cb: #D1FAE5;
      --cf: #047857
    }

    .s-cancelled {
      --cb: #FEE2E2;
      --cf: #B91C1C
    }

    .s-on {
      --cb: #D1FAE5;
      --cf: #047857
    }

    .s-off {
      --cb: #F1F5F9;
      --cf: #64748B
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .tabs button {
      background: var(--card);
      color: var(--mut);
      border: 1px solid var(--line);
      padding: 7px 13px;
      font-size: 12.5px
    }

    .tabs button.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    .tw {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--card);
      box-shadow: var(--sh)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 720px
    }

    th {
      background: var(--soft);
      color: var(--mut);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-weight: 800;
      text-align: left;
      padding: 11px 14px
    }

    td {
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      vertical-align: top
    }

    tr:hover td {
      background: #FAFBFD
    }

    .mut {
      color: var(--mut)
    }

    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .bar input,
    .bar select {
      max-width: 260px
    }

    .form {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px
    }

    .form label {
      font-size: 12px;
      font-weight: 700;
      color: var(--mut);
      display: block;
      margin-bottom: 6px
    }

    #modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .42);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow: auto;
      padding: 4vh 16px;
      z-index: 50
    }

    #modal .card {
      width: min(980px, 100%);
      animation: in .25s ease
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.98)
      }
    }

    img.th {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--soft)
    }

    .pgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px
    }

    .pc {
      padding: 0;
      overflow: hidden
    }

    .pc img {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      background: var(--soft);
      display: block
    }

    .pc .pb {
      padding: 14px
    }

    .coupon {
      border: 2px dashed var(--line);
      position: relative
    }

    .coupon b.code {
      font-size: 20px;
      letter-spacing: .08em;
      font-weight: 800;
      background: linear-gradient(135deg, var(--am), var(--pk));
      -webkit-background-clip: text;
      color: transparent
    }

    .tog {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #CBD5E1;
      position: relative;
      cursor: pointer;
      border: 0;
      padding: 0;
      flex-shrink: 0
    }

    .tog:after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: .2s
    }

    .tog.on {
      background: var(--em)
    }

    .tog.on:after {
      left: 21px
    }

    .tog:hover {
      transform: none;
      box-shadow: none
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px
    }

    .legend div {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600
    }

    .legend i {
      width: 10px;
      height: 10px;
      border-radius: 3px
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--mut)
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, rgba(99, 102, 241, .14), transparent 40%), radial-gradient(circle at 80% 90%, rgba(236, 72, 153, .12), transparent 40%), var(--bg);
      padding: 16px
    }

    .login .card {
      width: min(400px, 100%);
      padding: 32px
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      transition: .3s;
      z-index: 60
    }

    #toast.on {
      transform: translateX(-50%) translateY(0)
    }

    .mnav {
      display: none
    }

    .burger {
      display: none
    }

    .scrim {
      display: none
    }

    @media(max-width:1100px) {
      .kpis {
        grid-template-columns: repeat(2, 1fr)
      }

      .g2 {
        grid-template-columns: 1fr
      }

      .g3 {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:820px) {

      .app,
      .app.col {
        grid-template-columns: 1fr
      }

      aside {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 270px;
        z-index: 40;
        transform: translateX(-100%);
        transition: .25s;
        box-shadow: var(--sh)
      }

      .app.open aside {
        transform: none
      }

      .app.open .scrim {
        display: block
      }

      .scrim {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, .3);
        z-index: 30
      }

      .burger {
        display: inline-block
      }

      .colbtn {
        display: none
      }

      .top {
        padding: 12px 16px
      }

      .body {
        padding: 16px 16px 100px
      }

      .kpi b {
        font-size: 21px
      }

      .mnav {
        display: flex;
        position: fixed;
        bottom: 12px;
        left: 12px;
        right: 12px;
        z-index: 20;
        background: rgba(255, 255, 255, .9);
        backdrop-filter: blur(14px);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--sh);
        padding: 6px;
        justify-content: space-around
      }

      .mnav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--mut);
        padding: 6px 10px;
        border-radius: 14px
      }

      .mnav a.on {
        color: var(--in);
        background: #EEF2FF
      }

      .mnav a span:first-child {
        font-size: 17px
      }
    }

    @media(max-width:480px) {
      .kpis {
        gap: 10px
      }

      .card {
        padding: 16px
      }
    }

    /* ── POS Terminal ───────────────────────────────────────────────── */
    .pos {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
      align-items: start
    }
    .pos-scan-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center
    }
    .pos-scan-bar input {
      flex: 1;
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 2px solid var(--co);
      background: #EFF6FF;
      max-width: none
    }
    .pos-scan-bar input:focus {
      box-shadow: 0 0 0 4px rgba(59,130,246,.15)
    }
    .pos-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      padding-right: 4px
    }
    .qrc {
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: .15s box-shadow, .15s transform
    }
    .qrc:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -8px rgba(15,23,42,.18)
    }
    .qrc .qr {
      display: flex;
      justify-content: center;
      margin: 6px 0
    }
    .qrc .qr svg { width: 96px; height: 96px }
    .qrc svg.bc { width: 100%; height: 44px }
    .code {
      font-family: ui-monospace, monospace;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .06em;
      color: var(--in)
    }
    .bill-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line)
    }
    .qty {
      display: flex;
      align-items: center;
      gap: 4px
    }
    .qty button {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 8px;
      font-size: 16px;
      display: grid;
      place-items: center
    }
    .qty b { min-width: 22px; text-align: center }
    .bill-panel {
      position: sticky;
      top: 78px;
      max-height: calc(100vh - 100px);
      overflow-y: auto
    }
    .bill-panel .card { padding: 18px }
    .pay-methods { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 }
    .pay-methods button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      border-radius: 10px;
      background: var(--soft);
      color: var(--mut);
      border: 1.5px solid var(--line)
    }
    .pay-methods button.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }
    .tot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0
    }
    .tot-row.big {
      font-size: 20px;
      font-weight: 800;
      padding: 10px 0;
      border-top: 2px solid var(--line);
      margin-top: 4px
    }
    #printArea { display: none }

    @media(max-width:1100px) {
      .pos { grid-template-columns: 1fr }
      .bill-panel { position: static }
      .pos-items { max-height: 420px }
    }

    @media print {
      body > *:not(#printArea) { display: none !important }
      #printArea {
        display: block !important;
        font-family: 'Courier New', monospace;
        color: #000;
        width: 80mm;
        margin: 0 auto;
        font-size: 11px;
        padding: 4mm;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact
      }
      #printArea .ph { text-align: center; margin-bottom: 4mm }
      #printArea .ph .brand { font-size: 15px; font-weight: 900; letter-spacing: .1em }
      #printArea .ph .sub { font-size: 10px; color: #444; margin:1mm 0 }
      #printArea .pr { display: flex; justify-content: space-between; padding: 1mm 0; gap:4mm }
      #printArea .pr span:first-child { flex:1 }
      #printArea .pr span:last-child { text-align:right; white-space:nowrap }
      #printArea .pr.hd { font-weight: 700; border-bottom: 1px solid #000; margin-bottom: 1mm; font-size:10px }
      #printArea hr { border: 0; border-top: 1px dashed #000; margin: 2.5mm 0 }
      #printArea .tot-pr { display: flex; justify-content: space-between; padding: 1mm 0 }
      #printArea .tot-pr.big { font-size: 14px; font-weight: 900; border-top: 2px solid #000; padding-top: 2mm; margin-top:1mm }
      #printArea .footer { text-align: center; margin-top: 3mm; font-size: 9.5px; color: #555; border-top:1px dashed #000; padding-top:2mm }
      #printArea .qr-wrap { display: flex; justify-content: center; margin: 2mm 0 }
      #printArea .qr-wrap svg { width: 22mm !important; height: 22mm !important }
      #printArea .receipt-logo { display:block; margin:0 auto 2mm; max-height:14mm; max-width:50mm; object-fit:contain }
      #printArea .lbl {
        display: inline-block;
        text-align: center;
        padding: 3mm;
        border: 1px solid #000;
        margin: 2mm;
        page-break-inside: avoid;
        vertical-align: top
      }
      #printArea .lbl .lbl-brand { font-size: 8px; font-weight: 900; letter-spacing: .1em }
      #printArea .lbl svg { display:block; margin:0 auto }
      #printArea .lbl svg.bc { height: 10mm }
      #printArea .lbl .lbl-code { font-size: 8px; font-weight: 700; font-family: monospace; margin: 1mm 0 }
      #printArea .lbl .lbl-name { font-size: 7.5px; max-width:42mm; word-break:break-word }
      #printArea .lbl .lbl-price { font-size: 10px; font-weight: 900; margin-top:1mm }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="modal">
    <div class="card" id="mbody"></div>
  </div>
  <div id="toast"></div>
  <div id="printArea"></div>
  <script>
    const API = location.origin + "/api/v1";
    let TOKEN = localStorage.getItem("va_admin_token"), SCHEMA = null, COL = localStorage.getItem("va_col") === "1";
    const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
    const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const rs = n => "Rs " + Math.round(Number(n) || 0).toLocaleString();
    function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
    async function api(path, opt = {}) {
      const r = await fetch(API + path, { ...opt, headers: { ...(opt.body instanceof FormData ? {} : { "Content-Type": "application/json" }), ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}), ...(opt.headers || {}) } });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401 || r.status === 403) { if (TOKEN) logout(); throw new Error(j.detail || "Not allowed"); }
      if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail || j));
      return j;
    }
    function logout() { TOKEN = null; localStorage.removeItem("va_admin_token"); render(); }

                <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" id="go" style="width:100%;padding:13px;font-size:14px;font-weight:800;border-radius:12px;margin-top:6px;background:var(--ink);color:#fff">Sign in</button>
          
          <button type="button" id="auto-fill-btn" style="background:var(--soft);color:var(--ink);border:1px dashed var(--line);padding:8px 12px;font-size:12px;border-radius:10px;font-weight:600" title="Quick fill admin credentials">
            
          </button>
          
          <div id="err" style="color:var(--cr);font-size:13px;font-weight:600;min-height:18px;text-align:center"></div>
        </form>
      </div></div>`;

      const pwInput = $("#pw");
      const emInput = $("#em");
      const toggleBtn = $("#toggle-pw");
      const eyeIcon = $("#eye-icon");
      const autoFillBtn = $("#auto-fill-btn");

      if (autoFillBtn) {
        autoFillBtn.onclick = () => {
          emInput.value = "admin@veloura.com";
          pwInput.value = "admin123";
          pwInput.focus();
        };
      }

      if (toggleBtn && pwInput) {
        toggleBtn.onclick = (e) => {
          e.preventDefault();
          const isPw = pwInput.type === "password";
          pwInput.type = isPw ? "text" : "password";
          eyeIcon.innerHTML = isPw
            ? `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line>`
            : `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>`;
          pwInput.focus();
        };
      }

      const go = async () => {
        const btn = $("#go");
        const err = $("#err");
        err.textContent = "";
        const email = (emInput.value || "").trim();
        const password = pwInput.value || "";
        if (!email || !password) {
          err.textContent = "Please enter your email and password.";
          return;
        }
        btn.disabled = true;
        btn.textContent = "Verifying...";
        try {
          const j = await api("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password })
          });
          if (j.requires_otp) {
            throw new Error(j.message || "Verification code required for this account.");
          }
          if (!j.token || !j.roles || !Array.isArray(j.roles) || !j.roles.some(r => r === "admin" || r === "staff")) {
            throw new Error("This account does not have administrator privileges.");
          }
          TOKEN = j.token;
          localStorage.setItem("va_admin_token", TOKEN);
          toast("Welcome to Veloura Admin!");
          render();
        } catch (e) {
          err.textContent = e.message || "Login failed. Please check your credentials.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      };

      $("#login-form").onsubmit = (e) => {
        e.preventDefault();
        go();
      };

      emInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          pwInput.focus();
        }
      });
    }
    let LIVE = null;
    let DAYS = 30;
    async function render() {
      clearInterval(LIVE);
      if (!TOKEN) return loginView();
      if (!SCHEMA) { try { SCHEMA = (await api("/admin/schema")).schema; } catch (e) { return; } }
      const page = location.hash.slice(1).split("?")[0] || "dashboard";
      $("#app").innerHTML = `<div class="app ${COL ? "col" : ""}" id="shell"><div class="scrim" onclick="$('#shell').classList.remove('open')"></div>
  <aside><div class="brand"><div class="logo">VA</div><div><b>VELOURA</b><small>Apparel · Admin</small></div></div>
  ${MENU.map(([g, items]) => `<div class="grp">${g}</div>${items.map(([k, l, i]) => `<a href="#${k}" class="${k === page ? "on" : ""}" title="${l}"><span class="ic">${i}</span><span>${l}</span></a>`).join("")}`).join("")}
  <div style="flex:1"></div><a href="#" onclick="logout();return false"><span class="ic">⏻</span><span>Sign out</span></a></aside>
  <main><div class="top"><button class="ghost sm burger" onclick="$('#shell').classList.add('open')">☰</button>
  <button class="ghost sm colbtn" id="colb" title="Collapse">⇤</button><h1>${esc(LABEL[page] || page.replace(/_/g, " "))}</h1><span class="pulse">Live</span></div>
  <div class="body" id="main"><div class="empty">Loading…</div></div></main>
  <nav class="mnav">${[["dashboard", "◎", "Home"], ["orders", "▤", "Orders"], ["products", "▦", "Products"], ["coupons", "%", "Coupons"], ["site_settings", "⚙", "Settings"]].map(([k, i, l]) => `<a href="#${k}" class="${k === page ? "on" : ""}"><span>${i}</span><span>${l}</span></a>`).join("")}</nav></div>`;
      $("#colb").onclick = () => { COL = !COL; localStorage.setItem("va_col", COL ? "1" : "0"); $("#shell").classList.toggle("col", COL); };
      try {
        if (page === "dashboard") { await dashboard(DAYS); LIVE = setInterval(() => document.hidden || dashboard(DAYS).catch(() => { }), 5000); }
        else if (page === "orders") await orders();
        else if (page === "users") await users();
        else if (page === "pos") await pos();
        else if (page === "products") await products();
        else if (page === "coupons") await coupons();
        else if (page === "reviews") await reviews();
        else if (SCHEMA[page]?.singleton) await singleton(page);
        else await crud(page);
      } catch (e) { $("#main").innerHTML = `<div class="card" style="color:var(--cr);font-weight:600">${esc(e.message)}</div>`; }
    }
    window.onhashchange = render;

    // ══════════════════════════════════════════════════════
    // POS TERMINAL — Professional Complete Implementation
    // ══════════════════════════════════════════════════════

    // VA barcode: VA- + first 8 hex chars of UUID (no dashes)
    const vaCode = p => "VA-" + String(p.id).replace(/-/g, "").slice(0, 8).toUpperCase();

    // QR content: if qr_product_url_base set → full product URL, else just VA code
    // Admin scanner → VA-XXXXXXXX code → POS adds product
    // Customer scanner → https://veloura.pk/product/slug → product page opens
    let POS_CFG = null; // loaded once per pos() call

    const qrContent = (p) => {
      const base = POS_CFG?.qr_product_url_base?.trim();
      if (base && p.slug) return base.replace(/\/$/, "") + "/" + p.slug;
      return p.code; // fallback: VA code
    };

    // QR code SVG via qrcode-generator lib — waits for lib to load
    const qrSvg = (txt, cell = 3) => {
      if (!window.qrcode) return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="20mm" height="20mm"><rect width="10" height="10" fill="#eee"/><text x="5" y="6" text-anchor="middle" font-size="2" fill="#999">QR N/A</text></svg>`;
      try {
        const q = qrcode(0, "M");
        q.addData(String(txt || "VA")); q.make();
        return q.createSvgTag({ cellSize: cell, margin: 1, scalable: true });
      } catch(e) { return `<small style="font-size:10px;color:#999">${esc(String(txt))}</small>`; }
    };

    // Barcode SVG via JsBarcode lib (always uses VA code for barcode)
    const barSvg = (code, h = 36) => {
      if (!window.JsBarcode) return "";
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      try {
        JsBarcode(s, code, { format: "CODE128", height: h, displayValue: false, margin: 0 });
        s.setAttribute("class", "bc");
        return s.outerHTML;
      } catch { return ""; }
    };

    let BILL = [];
    let POS_PAY = "Cash";
    let POS_SALESMAN = "";

    async function pos() {
      // Load POS config + products in parallel
      const [cfgRes, { rows }] = await Promise.all([
        api("/settings/pos_settings").catch(() => ({ row: {} })),
        api("/admin/r/products")
      ]);
      POS_CFG = cfgRes.row || {};
      const salesmen = Array.isArray(POS_CFG.salesman_list) ? POS_CFG.salesman_list : [];
      if (!POS_SALESMAN && salesmen.length) POS_SALESMAN = salesmen[0];

      const items = rows
        .filter(r => r.active !== false)
        .map(r => ({ ...r, code: vaCode(r), unit: Number(r.sale_price || r.price) || 0 }));

      $("#main").innerHTML = `
        <div class="pos">
          <!-- LEFT: product grid -->
          <div>
            <div class="pos-scan-bar">
              <input id="scan" placeholder="🔍  Barcode scan / type VA- code or name…" autocomplete="off" autofocus>
              ${salesmen.length ? `<select id="sman" title="Salesman" style="max-width:160px">
                ${salesmen.map(s => `<option ${s===POS_SALESMAN?"selected":""}>${esc(s)}</option>`).join("")}
              </select>` : `<input id="smanInp" placeholder="Salesman name" style="max-width:150px" value="${esc(POS_SALESMAN)}">`}
              <button class="ghost" id="btnLabels" title="Print all product labels">🖨 Labels</button>
            </div>
            <div class="pos-items" id="pitems"></div>
          </div>

          <!-- RIGHT: bill panel -->
          <div class="bill-panel">
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <b style="font-size:16px;font-weight:800">🧾 Current bill</b>
                <button class="ghost sm" id="clr">Clear</button>
              </div>
              <div id="bill"></div>

              <div style="margin-top:12px">
                <label style="font-size:11px;font-weight:700;color:var(--mut)">CUSTOMER (optional)</label>
                <input id="cust" placeholder="Walk-in customer" style="margin-top:5px">
              </div>

              <div style="margin-top:10px">
                <label style="font-size:11px;font-weight:700;color:var(--mut)">PAYMENT</label>
                <div class="pay-methods">
                  <button class="on" data-pay="Cash">💵 Cash</button>
                  <button data-pay="Card">💳 Card</button>
                  <button data-pay="Online">📱 Online</button>
                </div>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">
                <div>
                  <label style="font-size:11px;font-weight:700;color:var(--mut)">DISCOUNT (Rs)</label>
                  <input id="disc" type="number" value="0" min="0" style="margin-top:5px">
                </div>
                <div>
                  <label style="font-size:11px;font-weight:700;color:var(--mut)">CASH RECEIVED</label>
                  <input id="recv" type="number" placeholder="0" style="margin-top:5px">
                </div>
              </div>

              <div id="tot" style="margin-top:14px"></div>
              <button id="prt" style="width:100%;margin-top:14px;padding:13px;background:linear-gradient(135deg,var(--in),var(--pk))">
                🖨 Print receipt
              </button>
            </div>
          </div>
        </div>`;

      // ── Salesman tracker ──
      const getSalesman = () => {
        const sel = $("#sman"), inp = $("#smanInp");
        return sel ? sel.value : (inp ? inp.value.trim() : POS_SALESMAN);
      };
      if ($("#sman")) $("#sman").onchange = e => { POS_SALESMAN = e.target.value; };
      if ($("#smanInp")) $("#smanInp").oninput = e => { POS_SALESMAN = e.target.value; };

      // ── Draw product grid ──
      const drawItems = () => {
        const q = $("#scan").value.trim().toLowerCase();
        const list = items.filter(p =>
          !q || p.code.toLowerCase().includes(q) ||
          (p.name || "").toLowerCase().includes(q) ||
          (p.category || "").toLowerCase().includes(q)
        );
        const cfg = POS_CFG || {};
        $("#pitems").innerHTML = list.length
          ? list.map(p => `
              <div class="card qrc" data-add="${esc(p.code)}" title="Click to add">
                ${cfg.label_show_qr !== false ? `<div class="qr">${qrSvg(qrContent(p), 2)}</div>` : ""}
                ${cfg.label_show_barcode !== false ? barSvg(p.code, 32) : ""}
                <div class="code" style="margin-top:4px">${esc(p.code)}</div>
                <b style="display:block;margin-top:3px;font-size:12px;line-height:1.3">${esc(p.name)}</b>
                <div class="mut" style="font-size:11px;margin:3px 0">${esc(p.category||"")} · ${p.stock??0} in stock</div>
                <div style="font-size:13px;font-weight:800;color:var(--in)">${rs(p.unit)}</div>
                <button class="ghost sm" style="margin-top:7px;width:100%;font-size:11px" data-lbl="${esc(p.code)}">🖨 Label</button>
              </div>`).join("")
          : `<div class="card empty">No product found for "<b>${esc(q)}</b>"</div>`;

        $$("[data-add]").forEach(c => c.onclick = e => { if (e.target.closest("[data-lbl]")) return; addItem(c.dataset.add); });
        $$("[data-lbl]").forEach(b => b.onclick = e => { e.stopPropagation(); printLabels(items.filter(p => p.code === b.dataset.lbl)); });
      };

      // ── Add item to bill ──
      const addItem = code => {
        const p = items.find(x => x.code === code);
        if (!p) { toast("Product not found"); return; }
        const line = BILL.find(x => x.code === code);
        if (line) line.qty++;
        else BILL.push({ code, name: p.name, unit: p.unit, qty: 1, slug: p.slug });
        drawBill();
      };

      // ── Totals ──
      const totals = () => {
        const sub = BILL.reduce((s, l) => s + l.unit * l.qty, 0);
        const d = Math.min(sub, Math.max(0, Number($("#disc")?.value) || 0));
        return { sub, d, total: sub - d };
      };

      // ── Draw bill ──
      const drawBill = () => {
        if (!BILL.length) {
          $("#bill").innerHTML = `<div class="empty" style="padding:16px 8px;font-size:12px">Scan or click a product to add</div>`;
        } else {
          $("#bill").innerHTML = BILL.map((l, i) => `
            <div class="bill-row">
              <div>
                <div style="font-size:13px;font-weight:700">${esc(l.name)}</div>
                <div class="code mut" style="font-size:10px">${esc(l.code)} · ${rs(l.unit)}</div>
              </div>
              <div class="qty">
                <button class="ghost sm" data-m="${i}">−</button>
                <b>${l.qty}</b>
                <button class="ghost sm" data-p="${i}">+</button>
              </div>
              <b style="min-width:58px;text-align:right">${rs(l.unit * l.qty)}</b>
            </div>`).join("");
          $$("[data-m]").forEach(b => b.onclick = () => {
            const l = BILL[+b.dataset.m];
            if (--l.qty <= 0) BILL.splice(+b.dataset.m, 1);
            drawBill();
          });
          $$("[data-p]").forEach(b => b.onclick = () => { BILL[+b.dataset.p].qty++; drawBill(); });
        }
        const t = totals(), recv = Number($("#recv")?.value) || 0, change = recv - t.total;
        const cfg = POS_CFG || {};
        $("#tot").innerHTML = `
          <div class="tot-row"><span class="mut">Subtotal</span><b>${rs(t.sub)}</b></div>
          ${t.d && cfg.show_discount !== false ? `<div class="tot-row" style="color:var(--em2)"><span>Discount</span><b>−${rs(t.d)}</b></div>` : ""}
          <div class="tot-row big"><span>TOTAL</span><span>${rs(t.total)}</span></div>
          ${recv && cfg.show_cash_recv !== false ? `
            <div class="tot-row"><span class="mut">Cash received</span><b>${rs(recv)}</b></div>
            ${cfg.show_change !== false ? `<div class="tot-row"><span class="mut">Change</span>
            <b style="color:${change>=0?"var(--em2)":"var(--cr)"}">${change>=0?rs(change):"⚠ Short "+rs(-change)}</b></div>` : ""}` : ""}`;
      };

      // ── Scanner: Enter = add ──
      $("#scan").oninput = drawItems;
      $("#scan").onkeydown = e => {
        if (e.key !== "Enter") return;
        const v = e.target.value.trim().toUpperCase();
        // Strip URL if someone scans a full URL QR
        const codeFromUrl = v.includes("/PRODUCT/") ? "VA-" + v.split("/").pop().toUpperCase() : v;
        const exact = items.find(p => p.code === v || p.code === codeFromUrl);
        const list = items.filter(p => p.code.includes(v) || (p.name||"").toUpperCase().includes(v));
        const hit = exact || (list.length === 1 ? list[0] : null);
        if (hit) { addItem(hit.code); e.target.value = ""; drawItems(); }
        else toast(list.length > 1 ? "Multiple matches — click one" : "Product not found");
      };

      // ── Payment ──
      $$("[data-pay]").forEach(b => b.onclick = () => {
        POS_PAY = b.dataset.pay;
        $$("[data-pay]").forEach(x => x.classList.toggle("on", x === b));
      });

      $("#disc").oninput = drawBill;
      $("#recv").oninput = drawBill;
      $("#clr").onclick = () => { if (BILL.length && !confirm("Clear bill?")) return; BILL = []; drawBill(); };
      $("#btnLabels").onclick = () => printLabels(items);

      // ── Print receipt ──
      $("#prt").onclick = () => {
        if (!BILL.length) { toast("Bill is empty — add products first"); return; }
        const cfg = POS_CFG || {};
        const t = totals();
        const no = "VA-POS-" + Date.now().toString(36).toUpperCase().slice(-6);
        const now = new Date();
        const dateStr = now.toLocaleDateString("en-PK", { day:"2-digit", month:"short", year:"numeric" });
        const timeStr = now.toLocaleTimeString("en-PK", { hour:"2-digit", minute:"2-digit" });
        const recv = Number($("#recv")?.value) || 0;
        const customer = $("#cust")?.value?.trim() || "Walk-in";
        const salesman = getSalesman();

        $("#printArea").innerHTML = `
          <div class="ph">
            ${cfg.logo_url ? `<img src="${esc(cfg.logo_url)}" style="height:14mm;margin-bottom:2mm;display:block;margin-left:auto;margin-right:auto">` : ""}
            <div class="brand">${esc(cfg.store_name||"VELOURA APPAREL")}</div>
            ${cfg.store_tagline ? `<div class="sub">${esc(cfg.store_tagline)}</div>` : ""}
            ${cfg.store_address ? `<div class="sub">${esc(cfg.store_address)}</div>` : ""}
            ${cfg.store_phone ? `<div class="sub">📞 ${esc(cfg.store_phone)}</div>` : ""}
            ${cfg.store_website ? `<div class="sub">${esc(cfg.store_website)}</div>` : ""}
          </div>
          <hr>
          ${cfg.show_receipt_no !== false ? `<div class="pr"><span>Receipt #</span><span><b>${no}</b></span></div>` : ""}
          ${cfg.show_date !== false ? `<div class="pr"><span>Date</span><span>${dateStr}</span></div>` : ""}

    /* ---------- charts (pure SVG) ---------- */
    function areaChart(trend) {
      const W = 640, H = 220, P = 28, n = trend.length, maxR = Math.max(1, ...trend.map(t => t.revenue)), maxO = Math.max(1, ...trend.map(t => t.orders));
      const x = i => P + (W - 2 * P) * (n < 2 ? 0 : i / (n - 1)), yR = v => H - P - (H - 2 * P) * v / maxR, yO = v => H - P - (H - 2 * P) * v / maxO;
      const smooth = pts => pts.map((p, i) => i ? `C${(pts[i - 1][0] + p[0]) / 2},${pts[i - 1][1]} ${(pts[i - 1][0] + p[0]) / 2},${p[1]} ${p[0]},${p[1]}` : `M${p[0]},${p[1]}`).join(" ");
      const pr = trend.map((t, i) => [x(i), yR(t.revenue)]), po = trend.map((t, i) => [x(i), yO(t.orders)]);
      const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${P}" x2="${W - P}" y1="${P + (H - 2 * P) * f}" y2="${P + (H - 2 * P) * f}" stroke="#EEF2F7"/>`).join("");
      const labels = trend.filter((_, i) => i % Math.ceil(n / 6) === 0).map(t => { const i = trend.indexOf(t); return `<text x="${x(i)}" y="${H - 6}" font-size="10" fill="#94A3B8" text-anchor="middle">${t.date.slice(5)}</text>` }).join("");
      const dots = trend.map((t, i) => `<circle cx="${x(i)}" cy="${yR(t.revenue)}" r="9" fill="transparent"><title>${t.date} — ${rs(t.revenue)} · ${t.orders} orders</title></circle>`).join("");
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#10B981" stop-opacity=".35"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></linearGradient></defs>
  ${grid}<path d="${smooth(pr)} L${x(n - 1)},${H - P} L${P},${H - P} Z" fill="url(#ga)"/><path d="${smooth(pr)}" fill="none" stroke="#10B981" stroke-width="2.6"/>
  <path d="${smooth(po)}" fill="none" stroke="#6366F1" stroke-width="2.2" stroke-dasharray="5 4"/>${labels}${dots}</svg>
  <div style="display:flex;gap:16px;font-size:12px;font-weight:700;margin-top:6px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#10B981"></i> Revenue</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#6366F1"></i> Orders</span></div>`;
    }
    const PAL = ["#6366F1", "#EC4899", "#10B981", "#F59E0B", "#3B82F6", "#8B5CF6", "#EF4444", "#14B8A6"];
    function donut(obj) {
      const e = Object.entries(obj).sort((a, b) => b[1] - a[1]), tot = e.reduce((s, [, v]) => s + v, 0);
      if (!tot) return `<div class="empty">No sales yet</div>`;
      let a = 0; const R = 70, C = 2 * Math.PI * R;
      const segs = e.map(([k, v], i) => { const l = C * v / tot, s = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${PAL[i % 8]}" stroke-width="22" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-a}" transform="rotate(-90 90 90)"><title>${esc(k)}: ${rs(v)}</title></circle>`; a += l; return s; }).join("");
      return `<svg viewBox="0 0 180 180" width="180" style="display:block;margin:auto">${segs}<text x="90" y="86" text-anchor="middle" font-size="11" fill="#64748B" font-weight="700">Total</text><text x="90" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="#0F172A">${rs(tot)}</text></svg>
  <div class="legend">${e.slice(0, 6).map(([k, v], i) => `<div><i style="background:${PAL[i % 8]}"></i>${esc(k)}<span style="margin-left:auto" class="mut">${Math.round(v / tot * 100)}%</span></div>`).join("")}</div>`;
    }
    const SCOL = { pending: "#F59E0B", confirmed: "#3B82F6", processing: "#8B5CF6", shipped: "#6366F1", delivered: "#10B981", cancelled: "#EF4444" };
    function stacked(by) {
      const tot = Object.values(by).reduce((s, v) => s + v, 0);
      if (!tot) return `<div class="empty">No orders yet</div>`;
      return `<div style="display:flex;height:16px;border-radius:999px;overflow:hidden;margin:6px 0 16px">${STATUSES.filter(s => by[s]).map(s => `<div title="${s}: ${by[s]}" style="width:${by[s] / tot * 100}%;background:${SCOL[s]}"></div>`).join("")}</div>
  ${STATUSES.map(s => `<div style="display:flex;align-items:center;gap:10px;margin:9px 0"><span class="chip s-${s}" style="min-width:92px">${s}</span>
  <div style="flex:1;height:8px;background:var(--soft);border-radius:9px;overflow:hidden"><div style="height:100%;width:${(by[s] || 0) / tot * 100}%;background:${SCOL[s]};border-radius:9px;transition:width .6s"></div></div><b style="width:28px;text-align:right">${by[s] || 0}</b></div>`).join("")}`;
    }

    async function heroSlides(meta, rows) {
      const renderCards = (list) => {
        if (!list.length) return `<div class="card empty">No slides yet. Add one below.</div>`;
        return list.map((r, i) => `<div class="hs-card card" draggable="true" data-i="${i}" style="display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;cursor:grab">

      <div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.title || "—")}</b><span class="mut" style="font-size:12px">${esc(r.eyebrow || "")} ${r.cta_label ? `· ${esc(r.cta_label)}` : ""}</span></div>
      <button class="tog ${r.active ? "on" : ""}" data-tg="${i}" style="flex-shrink:0" title="Active"></button>

    </div>`).join("");
      };
      let order = [...rows];
      $("#main").innerHTML = `<div class="bar"><button id="add">+ Add slide</button><span class="mut" style="margin-left:auto;font-size:12px;font-weight:700">Drag rows to reorder</span></div><div id="hs-list">${renderCards(order)}</div>`;
      const rebind = () => {
        $$(".hs-card").forEach(card => {
          card.ondragstart = e => { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", card.dataset.i); card.style.opacity = ".4"; };
          card.ondragend = () => { $$(".hs-card").forEach(c => c.style.opacity = ""); };
          card.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; card.style.background = "#F0F4FF"; };
          card.ondragleave = () => { card.style.background = ""; };
          card.ondrop = async e => {
            e.preventDefault(); card.style.background = "";
            const from = parseInt(e.dataTransfer.getData("text/plain"), 10);
            const to = parseInt(card.dataset.i, 10);
            if (from === to) return;
            const moved = order.splice(from, 1)[0]; order.splice(to, 0, moved);
            $("#hs-list").innerHTML = renderCards(order); rebind();
            try {
              await Promise.all(order.map((r, idx) => api(`/admin/r/hero_slides/${r.id}`, { method: "PUT", body: JSON.stringify({ sort_order: idx }) })));
              toast("Slide order saved");
            } catch (e) { toast(e.message); }
          };
        });
        $$(".hs-card [data-tg]").forEach(b => b.onclick = () => toggleRow("hero_slides", order[b.dataset.tg], "active"));
        $$(".hs-card [data-i]").forEach(b => b.onclick = () => editor("hero_slides", order[b.dataset.i]));
      };
      rebind();
      $("#add").onclick = () => editor("hero_slides", {});
    }

    async function crud(name) {
      const meta = SCHEMA[name]; const { rows } = await api("/admin/r/" + name);

    /* ── Tag-chip input for JSON arrays ── */
    function buildTagInput(id, arr) {
      let items = Array.isArray(arr) ? [...arr] : (arr ? String(arr).split(",").map(x=>x.trim()).filter(Boolean) : []);
      const wrap = document.createElement("div");
      wrap.className = "tag-wrap"; wrap.id = id;
      wrap.dataset.kind = "tags";
      const render = () => {
        wrap.innerHTML = items.map((t,i)=>`<span class="tag">${esc(t)}<button type="button" data-ri="${i}">×</button></span>`).join("");
        const inp = document.createElement("input");
        inp.placeholder = "Add item, press Enter";
        inp.onkeydown = e => {
          if ((e.key === "Enter" || e.key === ",") && inp.value.trim()) {
            e.preventDefault(); items.push(inp.value.trim()); render();
          } else if (e.key === "Backspace" && !inp.value && items.length) {
            items.pop(); render();
          }
        };
        wrap.appendChild(inp);
        wrap.querySelectorAll("[data-ri]").forEach(b => b.onclick = () => { items.splice(Number(b.dataset.ri),1); render(); });
        inp.focus();
      };
      render();
      wrap._getVal = () => items;
      return wrap;
    }

    /* ── Image uploader widget ── */
    function buildImageUploader(id, val, multi = false) {
      const wrap = document.createElement("div");
      let urls = multi ? (Array.isArray(val) ? [...val] : []) : (val ? [val] : []);

      const renderPrev = () => {
        const prev = wrap.querySelector(".img-prev");
        if (prev) prev.remove();
        if (!urls.length) return;
        if (multi) {
          const g = document.createElement("div"); g.className = "gal-grid";
          urls.forEach((u,i) => { g.innerHTML += `<div class="gi"><img src="${esc(u)}"><button class="rm" data-ri="${i}" type="button">×</button></div>`; });
          wrap.insertBefore(g, wrap.querySelector(".img-up"));
          g.querySelectorAll("[data-ri]").forEach(b => b.onclick = () => { urls.splice(Number(b.dataset.ri),1); renderPrev(); });
        } else {
          const d = document.createElement("div"); d.className = "img-prev";
          d.innerHTML = `<img src="${esc(urls[0])}"><button class="rm" type="button">×</button>`;
          d.querySelector(".rm").onclick = () => { urls=[]; renderPrev(); };
          wrap.insertBefore(d, wrap.querySelector(".img-up"));
        }
      };

      const upDiv = document.createElement("div"); upDiv.className = "img-up";
      upDiv.innerHTML = `<input type="file" accept="image/*,video/*" ${multi?"multiple":""}><div class="ico">🖼</div><div class="lbl"><b>Click to upload</b> or drag & drop<br><span style="font-size:11px">JPG, PNG, WebP, GIF</span></div>`;
      const fileInp = upDiv.querySelector("input");
      upDiv.onclick = e => { if(e.target !== fileInp) fileInp.click(); };
      fileInp.onchange = async () => {
        upDiv.innerHTML = `<div class="ico">⏳</div><div class="lbl">Uploading…</div>`;
        try {
          for (const file of fileInp.files) {
            const fd = new FormData(); fd.append("file", file);
            const {url} = await api("/admin/upload",{method:"POST",body:fd});
            if (multi) urls.push(url); else urls = [url];
          }
          toast("Uploaded ✓");
        } catch(e) { toast("Upload failed: "+e.message); }
        upDiv.innerHTML = `<input type="file" accept="image/*,video/*" ${multi?"multiple":""}><div class="ico">🖼</div><div class="lbl"><b>Click to upload</b> or drag & drop</div>`;
        upDiv.querySelector("input").onchange = fileInp.onchange;
        upDiv.onclick = e => { if(e.target!==upDiv.querySelector("input")) upDiv.querySelector("input").click(); };
        renderPrev();
      };

      wrap.appendChild(upDiv);
      wrap.id = id; wrap.dataset.kind = "imgup";
      wrap._getVal = () => multi ? urls : (urls[0] || null);
      renderPrev();
      return wrap;
    }

    /* ── Star rating widget ── */
    function buildStarRating(id, val) {
      const wrap = document.createElement("div"); wrap.className = "star-pick"; wrap.id = id; wrap.dataset.kind = "stars";
      let cur = Number(val) || 5;
      const render = () => {
        wrap.innerHTML = [1,2,3,4,5].map(n=>`<button type="button" class="${n<=cur?"on":""}" data-v="${n}">★</button>`).join("");
        wrap.querySelectorAll("button").forEach(b => { b.onmouseenter=()=>{ wrap.querySelectorAll("button").forEach((x,i)=>x.classList.toggle("on",i<Number(b.dataset.v))); }; b.onmouseleave=render; b.onclick=()=>{ cur=Number(b.dataset.v); render(); }; });
      };
      render();
      wrap._getVal = () => cur;
      return wrap;
    }

    /* ── Render one section ── */
    function renderSection(sec, row, ro) {
      const fields = sec.fields.map(f => renderField(f, row[f.n], ro)).join("");
      return `<div class="msec"><div class="msec-title">${esc(sec.title)}</div><div class="mrow ${sec.cols || ""}">${fields}</div></div>`;
    }

    /* ── Render one field (returns HTML string for simple fields, or mounts widget) ── */
    const WIDGET_FIELDS = new Set(); // stores field names that need widget (not innerHTML)

    function renderField(f, v, ro) {
      const id = "f_" + f.n;
      const dis = ro || SKIP_COLS.has(f.n) ? "disabled" : "";
      const label = `<label>${f.label || f.n.replace(/_/g," ")}${f.req?`<span class="req">*</span>`:""}</label>`;
      const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "";
      const kind = f.kind || (DATE_COLS.has(f.n) ? "datetime" : TEXTAREA_COLS.has(f.n) ? "textarea" : JSON_ARRAY_COLS.has(f.n) ? "tags" : IMG_COLS.has(f.n) ? "img" : "text");

      // Widgets that need JS — mark them, render placeholder div
      if (kind === "img" || kind === "gallery" || kind === "tags" || kind === "stars") {
        WIDGET_FIELDS.add(f.n);
        return `<div class="mf"><label>${f.label || f.n.replace(/_/g," ")}${f.req?`<span class="req">*</span>`:""}</label><div id="${id}_wrap" data-widget="${kind}" data-val='${esc(JSON.stringify(v??null))}' data-multi="${kind==="gallery"?1:""}" data-ro="${ro?1:""}"></div>${hint}</div>`;
      }

      let inp = "";
      if (kind === "bool") {
        const checked = v === true || v === "true" ? "checked" : "";
        inp = `<div class="sw-wrap"><label>${esc(f.label || f.n.replace(/_/g," "))}</label><label class="sw"><input type="checkbox" id="${id}" ${checked} ${dis}><span class="sw-sl"></span></label></div>`;
        return `<div class="mf" data-bool="1">${inp}${hint}</div>`;
      }
      if (kind === "select") {
        inp = `<select id="${id}" ${dis}>${(f.opts||[]).map(o=>`<option value="${esc(o)}" ${o===(v||"")?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
      } else if (kind === "textarea" || kind === "textarea-tall") {
        inp = `<textarea id="${id}" ${dis} class="${kind==="textarea-tall"?"tall":""}" placeholder="${esc(f.hint||f.label||f.n.replace(/_/g,' '))}">${esc(v??'')}</textarea>`;
      } else if (kind === "date") {
        inp = `<input type="date" id="${id}" value="${fmtDateForInput(v,false)}" ${dis}>`;
      } else if (kind === "datetime") {
        inp = `<input type="datetime-local" id="${id}" value="${fmtDateForInput(v,true)}" ${dis}>`;
      } else if (kind === "num") {
        inp = `<input type="number" id="${id}" step="any" value="${esc(v??'')}" placeholder="${esc(f.hint||'0')}" ${dis}>`;
      } else if (kind === "int") {
        inp = `<input type="number" id="${id}" step="1" value="${esc(v??'')}" placeholder="${esc(f.hint||'0')}" ${dis}>`;
      } else if (kind === "json") {
        inp = `<textarea id="${id}" ${dis} placeholder="JSON array or object">${esc(v==null?'':JSON.stringify(v,null,1))}</textarea>`;
      } else {
        inp = `<input type="text" id="${id}" value="${esc(v??'')}" placeholder="${esc(f.hint||f.label||f.n.replace(/_/g,' '))}" ${dis}>`;
      }
      return `<div class="mf">${label}${inp}${hint}</div>`;
    }

    /* ── Mount widgets after HTML is injected ── */
    function mountWidgets() {
      document.querySelectorAll("[data-widget]").forEach(wrap => {
        const kind = wrap.dataset.widget;
        const id = wrap.id.replace(/_wrap$/,"");
        let val; try { val = JSON.parse(wrap.dataset.val); } catch { val = null; }
        const ro = wrap.dataset.ro === "1";
        if (ro) { wrap.innerHTML = `<span class="mut" style="font-size:12px">${esc(String(val??''))}</span>`; return; }
        let widget;
        if (kind === "img") widget = buildImageUploader(id, val, false);
        else if (kind === "gallery") widget = buildImageUploader(id, val, true);
        else if (kind === "tags") widget = buildTagInput(id, Array.isArray(val)?val:val?[val]:[]);
        else if (kind === "stars") widget = buildStarRating(id, val);
        if (widget) wrap.replaceWith(widget);
      });
    }

    /* ── Collect all values from the open form ── */
    function collectForm(name, row) {
      const spec = FORMS[name];
      const meta = SCHEMA[name];
      const out = {};

      if (spec) {
        const allFields = spec(row).flatMap(s => s.fields);
        for (const f of allFields) {
          const id = "f_" + f.n;
          // Widget
          const widget = document.getElementById(id);
          if (widget && widget._getVal !== undefined) { out[f.n] = widget._getVal(); continue; }
          const el = document.getElementById(id); if (!el || el.disabled) continue;
          const kind = f.kind || "text";
          if (kind === "bool") out[f.n] = el.type === "checkbox" ? el.checked : el.value === "true";
          else if (kind === "num") out[f.n] = el.value === "" ? null : parseFloat(el.value);
          else if (kind === "int") out[f.n] = el.value === "" ? null : parseInt(el.value, 10);
          else if (kind === "date" || kind === "datetime") out[f.n] = el.value ? new Date(el.value).toISOString() : null;
          else out[f.n] = el.value === "" ? null : el.value;
        }
      } else {
        // Generic fallback for modules without a custom form
        for (const c of meta.columns) {
          if (SKIP_COLS.has(c.name)) continue;
          const el = document.getElementById("f_" + c.name); if (!el || el.disabled) continue;
          let v = el.value;
          if (c.kind === "bool") v = el.type === "checkbox" ? el.checked : v === "true";
          else if (c.kind === "json") { try { v = v.trim() ? JSON.parse(v) : null; } catch { throw new Error(c.name + ": invalid JSON"); } }
          else if (c.kind === "int" || c.kind === "num") v = v === "" ? null : Number(v);
          else if (v === "") v = null;
          out[c.name] = v;
        }
      }
      return out;
    }

    /* ── Open the editor modal ── */
    function editor(name, row) {
      const meta = SCHEMA[name], ro = meta.readonly;
      const spec = FORMS[name];
      const isNew = !row.id;
      const accent = isNew ? "var(--em)" : "var(--co)";
      const badgeText = isNew ? "New record" : "Editing";

      let bodyHtml = "";
      WIDGET_FIELDS.clear();

      if (spec) {
        bodyHtml = spec(row).map(sec => renderSection(sec, row, ro)).join("");
      } else {
        // Generic form for modules without custom spec
        const cols = meta.columns.filter(c => !SKIP_COLS.has(c.name));
        const fields = cols.map(c => {
          const kind = DATE_COLS.has(c.name) ? (c.name.includes("_at") ? "datetime" : "date") : TEXTAREA_COLS.has(c.name) ? "textarea" : c.kind;
          return renderField({n:c.name, label:c.name.replace(/_/g," "), kind, req:c.required}, row[c.name], ro);
        }).join("");
        bodyHtml = `<div class="msec"><div class="mrow">${fields}</div></div>`;
      }

      $("#mbody").innerHTML = `
        <div class="mhdr">
          <div style="display:flex;align-items:center;gap:10px">
            <h2>${isNew?"Add new":"Edit"} ${esc(LABEL[name]||name.replace(/_/g," "))}</h2>
            <span class="badge" style="background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(236,72,153,.08));color:var(--in)">${badgeText}</span>
          </div>
          <button class="cl" id="cl" title="Close">✕</button>
        </div>
        <div class="mbody">${bodyHtml}</div>
        <div class="mfooter">
          ${ro ? `<span class="mut" style="font-size:13px;font-weight:600">Read-only record</span>` : `<button id="sv" style="background:linear-gradient(135deg,var(--in),var(--pk))">Save changes</button>`}
          ${row.id && !ro ? `<button class="ghost" id="del" style="color:var(--cr);border-color:var(--cr);background:transparent">Delete</button>` : ""}
          <button class="ghost" id="cl2" style="margin-left:auto">Cancel</button>
        </div>`;

      $("#modal").style.display = "flex";
      mountWidgets();

      const close = () => { $("#modal").style.display = "none"; };
      $("#cl").onclick = close;
      if ($("#cl2")) $("#cl2").onclick = close;
      $("#modal").onclick = e => { if (e.target === $("#modal")) close(); };

      if ($("#sv")) {
        $("#sv").onclick = async () => {
          const btn = $("#sv"); btn.classList.add("saving"); btn.textContent = "Saving…";
          try {
            const data = collectForm(name, row);
            await api("/admin/r/" + name + (row.id ? "/" + row.id : ""), {
              method: row.id ? "PUT" : "POST", body: JSON.stringify(data)
            });
            close(); toast("✓ Saved — live on store"); render();
          } catch(e) { toast("⚠ " + e.message); btn.classList.remove("saving"); btn.textContent = "Save changes"; }
        };
      }

      if ($("#del")) {
        $("#del").onclick = async () => {
          if (!confirm(`Delete this ${LABEL[name]||name}? This cannot be undone.`)) return;
          try {
            await api(`/admin/r/${name}/${row.id}`, { method: "DELETE" });
            close(); toast("Deleted"); render();
          } catch(e) { toast(e.message); }
        };
      }
    }

                        </td>
                        <td>
                          <div class="mut" style="font-size:12px">${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</div>
                        </td>
                        <td style="text-align:right">
                          <div style="display:inline-flex;gap:6px">
                            <button class="ghost sm edit-u" data-uid="${u.id}">Edit</button>
                            <button class="ghost sm del-u" data-uid="${u.id}" style="color:var(--cr);border-color:var(--line)">✕</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;

        $("#u_search").oninput = e => { filterQ = e.target.value; renderUsers(); };
        $("#u_role").onchange = e => { filterRole = e.target.value; renderUsers(); };
        $("#u_ver").onchange = e => { filterVer = e.target.value; renderUsers(); };
        $("#u_add").onclick = () => openUserModal();

        $$(".edit-u").forEach(b => {
          b.onclick = () => {
            const u = allUsers.find(x => x.id === b.dataset.uid);
            if (u) openUserModal(u);
          };
        });

        $$(".del-u").forEach(b => {
          b.onclick = async () => {
            const u = allUsers.find(x => x.id === b.dataset.uid);
            if (!u) return;
            if (!confirm(`Delete customer account "${u.full_name || u.email}"? This action cannot be undone.`)) return;
            try {
              await api(`/admin/users/${u.id}`, { method: "DELETE" });
              toast("User deleted");
              await users();
            } catch (err) { toast("⚠ " + err.message); }
          };
        });
      };

      const openUserModal = (u = null) => {
        const isEdit = !!u;
        $("#mbody").innerHTML = `
          <div class="mhdr">
            <div style="display:flex;align-items:center;gap:10px">
              <h2>${isEdit ? "Edit Customer Account" : "Add New Customer"}</h2>
              <span class="badge" style="background:#EEF2FF;color:var(--in)">${isEdit ? esc(u.email) : "New User"}</span>
            </div>
            <button class="cl" id="u_cl">✕</button>
          </div>
          <div class="mbody">
            <div class="msec">
              <div class="stitle">Account Credentials</div>
              <div class="mrow half">
                <div>
                  <label style="font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px">Email address *</label>
                  <input id="uf_email" type="email" placeholder="customer@example.com" value="${esc(u ? u.email : '')}" required>
                </div>
                <div>
                  <label style="font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px">Password ${isEdit ? '(leave blank to keep current)' : '*'}</label>
                  <input id="uf_password" type="password" placeholder="${isEdit ? '••••••••' : 'Min 6 characters'}" ${isEdit ? '' : 'required'}>
                </div>
              </div>
            </div>

            <div class="msec">
              <div class="stitle">Profile & Contact Information</div>
              <div class="mrow half">
                <div>
                  <label style="font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px">Full Name</label>
                  <input id="uf_name" type="text" placeholder="e.g. Muhammad Ali" value="${esc(u ? (u.full_name || '') : '')}">
                </div>
                <div>
                  <label style="font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px">Phone Number (WhatsApp Outreach)</label>
                  <input id="uf_phone" type="tel" placeholder="03001234567 or +923001234567" value="${esc(u ? (u.phone || '') : '')}">
                </div>
              </div>
              <div class="mrow half" style="margin-top:12px">
                <div>
                  <label style="font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px">City</label>
                  <input id="uf_city" type="text" placeholder="Lahore, Karachi, Islamabad…" value="${esc(u ? (u.city || '') : '')}">
                </div>
                <div>
                  <label style="font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px">Street Address</label>
                  <input id="uf_address" type="text" placeholder="House #, Street, Sector" value="${esc(u ? (u.address || '') : '')}">
                </div>
              </div>
            </div>

            <div class="msec">
              <div class="stitle">Status & Permissions</div>
              <div class="mrow half">
                <div>
                  <label style="font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:6px">User Role</label>
                  <select id="uf_role">
                    <option value="user" ${u && u.roles.includes('user') ? 'selected' : ''}>Customer (Standard User)</option>
                    <option value="staff" ${u && u.roles.includes('staff') ? 'selected' : ''}>Staff (Store Manager)</option>
                    <option value="admin" ${u && u.roles.includes('admin') ? 'selected' : ''}>Admin (Full Access)</option>
                  </select>
                </div>
                <div style="display:flex;align-items:center;gap:10px;padding-top:24px">
                  <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer">
                    <input id="uf_verified" type="checkbox" style="width:auto;accent-color:var(--em)" ${(!u || u.is_verified) ? 'checked' : ''}>
                    <span>Email & Phone Verified (Account Active)</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
          <div class="mfooter">
            <button id="uf_save" style="background:linear-gradient(135deg,var(--in),var(--pk))">${isEdit ? 'Save Changes' : 'Create Customer'}</button>
            <button class="ghost" id="uf_cancel" style="margin-left:auto">Cancel</button>
          </div>
        `;

        $("#modal").style.display = "flex";
        const closeModal = () => { $("#modal").style.display = "none"; };
        $("#u_cl").onclick = closeModal;
        $("#uf_cancel").onclick = closeModal;
        $("#modal").onclick = e => { if (e.target === $("#modal")) closeModal(); };

        $("#uf_save").onclick = async () => {
          const btn = $("#uf_save");
          const email = $("#uf_email").value.trim();
          const password = $("#uf_password").value;
          const full_name = $("#uf_name").value.trim();
          const phone = $("#uf_phone").value.trim();
          const city = $("#uf_city").value.trim();
          const address = $("#uf_address").value.trim();
          const role = $("#uf_role").value;
          const is_verified = $("#uf_verified").checked;

          if (!email) { toast("Email address is required"); return; }
          if (!isEdit && !password) { toast("Password is required for new accounts"); return; }
          if (password && password.length < 6) { toast("Password must be at least 6 characters"); return; }

          btn.classList.add("saving"); btn.textContent = "Saving…";
          try {
            const payload = { email, full_name, phone, city, address, role, is_verified };
            if (password) payload.password = password;

            if (isEdit) {
              await api(`/admin/users/${u.id}`, { method: "PUT", body: JSON.stringify(payload) });
              toast("✓ Customer profile updated");
            } else {
              await api(`/admin/users`, { method: "POST", body: JSON.stringify(payload) });
              toast("✓ Customer created successfully");
            }
            closeModal();
            await users();
          } catch (err) {
            toast("⚠ " + err.message);
            btn.classList.remove("saving");
            btn.textContent = isEdit ? "Save Changes" : "Create Customer";
          }
        };
      };

      renderUsers();
    }
    render();
  </script>
</body>

</html>
