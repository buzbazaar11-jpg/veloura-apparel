# ──────────────────────────────────────────────────────────────────────────────
# Veloura Apparel — Backend API (FastAPI / uvicorn)
# Served at: https://api.velouraapparel.store
# Replace: velouraapparel.store → your actual domain
# ──────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.velouraapparel.store;
    return 301 https://$host$request_uri;
}

# Main HTTPS API server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.velouraapparel.store;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.velouraapparel.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.velouraapparel.store/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── CORS — allow requests only from the frontend domain ─────────────────
    # Preflight
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin  "https://velouraapparel.store" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Max-Age 3600;
        return 204;
    }
    add_header Access-Control-Allow-Origin "https://velouraapparel.store" always;

    # ── Limits ──────────────────────────────────────────────────────────────
    client_max_body_size 210m;   # Allow image uploads (MAX_UPLOAD_MB=200)
    client_body_timeout  120s;
    client_header_timeout 30s;
    keepalive_timeout     65s;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # ── Admin static panel (served as static file) ──────────────────────────
    location = /admin {
        proxy_pass         http://127.0.0.1:8000/admin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Admin panel — no public caching
        add_header Cache-Control "no-store";
    }

    # ── Uploaded media files ─────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:8000/uploads/;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=604800";  # 1 week
        access_log off;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # Public catalog endpoints can be cached by CDN/browsers
        # Individual endpoints set their own Cache-Control via FastAPI
    }
}
