# ──────────────────────────────────────────────────────────────────────────────
# Veloura Apparel — Frontend (TanStack Start SSR)
# Served at: https://velouraapparel.store
# Replace: velouraapparel.store → your actual domain
# ──────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name velouraapparel.store www.velouraapparel.store;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name velouraapparel.store www.velouraapparel.store;

    # ── TLS (managed by Certbot) ────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/velouraapparel.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velouraapparel.store/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP — adjust src values for your CDN / Supabase project URL
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.velouraapparel.store; frame-ancestors 'none';" always;

    # ── Limits ──────────────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    keepalive_timeout    65s;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml font/woff2 application/manifest+json;

    # ── Static assets with long-term caching ────────────────────────────────
    # TanStack/Nitro builds hashed filenames into /_build/ — safe to cache forever
    location ~* ^/_build/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Favicon / robots / manifest ─────────────────────────────────────────
    location ~* \.(ico|png|txt|xml|webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── SSR — all other requests proxy to Node server ────────────────────────
    # TanStack Start is SSR; it must NOT be served as static files
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Health check endpoint ────────────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
